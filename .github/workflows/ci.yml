name: CI

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: cross_border_copilot
          MYSQL_USER: copilot
          MYSQL_PASSWORD: copilot_ci
          MYSQL_ROOT_PASSWORD: root_ci_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=copilot --password=copilot_ci"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://copilot:copilot_ci@127.0.0.1:3306/cross_border_copilot
      REDIS_URL: redis://127.0.0.1:6379
      JWT_ACCESS_SECRET: ci-secret-with-at-least-thirty-two-characters
      WEB_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:deploy --workspace @cross-border/api
      - run: npm run test:integration
        env:
          RUN_INTEGRATION_TESTS: 'true'
      - run: npm run verify
      - run: docker compose config

  container:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [api, worker, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
